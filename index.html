<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#04121a" />
    <script>
      // Aplica o tema salvo antes de desenhar a página (evita piscar).
      (function () {
        var h = document.documentElement;
        try {
          var t = localStorage.getItem("tema") || "escuro";
          if (t === "sistema") t = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
          h.dataset.tema = t;
          h.dataset.paleta = t === "claro" ? localStorage.getItem("tema-claro") || "ceu" : localStorage.getItem("tema-escuro") || "oceano";
        } catch (e) {
          h.dataset.tema = "escuro";
          h.dataset.paleta = "oceano";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/icone-32.png" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Montzion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
